version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    networks:
      - aegis_net

  gateway-service:
    build:
      context: .
      dockerfile: docker/gateway-service.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AEGIS_PLANNER_SERVICE_URL=http://planner-service:8003
    depends_on:
      - planner-service
    networks:
      - aegis_net

  ml-service:
    build:
      context: .
      dockerfile: docker/ml-service.Dockerfile
    environment:
      - AEGIS_MODEL_ARTIFACTS_PATH=/app/artifacts/models
      - AEGIS_FEATURE_STORE_PATH=/app/artifacts/feature_store
    networks:
      - aegis_net

  graph-service:
    build:
      context: .
      dockerfile: docker/graph-service.Dockerfile
    environment:
      - AEGIS_NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - neo4j
    networks:
      - aegis_net

  evidence-service:
    build:
      context: .
      dockerfile: docker/evidence-service.Dockerfile
    environment:
      - AEGIS_POSTGRES_DSN=postgresql://postgres:aegis@postgres:5432/postgres
    depends_on:
      - postgres
    networks:
      - aegis_net

  planner-service:
    build:
      context: .
      dockerfile: docker/planner-service.Dockerfile
    environment:
      - AEGIS_ML_SERVICE_URL=http://ml-service:8000
      - AEGIS_GRAPH_SERVICE_URL=http://graph-service:8001
      - AEGIS_EVIDENCE_SERVICE_URL=http://evidence-service:8002
    depends_on:
      - ml-service
      - graph-service
      - evidence-service
    networks:
      - aegis_net

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=aegis
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    networks:
      - aegis_net

  neo4j:
    image: neo4j:5.12.0
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7688:7687"
      - "7474:7474"
    networks:
      - aegis_net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - aegis_net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - aegis_net

networks:
  aegis_net:
