apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: aegis-aml
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'aegis_services'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: (gateway-service|planner-service|ml-service|graph-service|evidence-service)
            action: keep
