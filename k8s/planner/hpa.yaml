apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: planner-service-hpa
  namespace: aegis-aml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: planner-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
